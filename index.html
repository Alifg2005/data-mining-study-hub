<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Data Mining Study Hub: chapter review notes and 20-question practice quizzes for CIS 517 Data Mining." />
    <meta name="color-scheme" content="light dark" />
    <title>Data Mining Study Hub</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a theme flash.
      // Keep the storage key in sync with src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('dmsh-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
